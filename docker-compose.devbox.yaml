# Local devbox infra for annotate — driven by scripts/devbox (do not run by hand).
# Unique project name `annotate-devbox`; host ports are loopback-only and chosen to
# avoid the other compose stacks on this machine. Local data only — never a cluster DB.
name: annotate-devbox

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: annotate
      POSTGRES_PASSWORD: annotate_dev
      POSTGRES_DB: annotate_dev
    ports:
      - "127.0.0.1:${DEVBOX_PG_PORT:-54391}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annotate -d annotate_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${DEVBOX_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # minio/minio left Docker Hub; bitnamilegacy/minio is the same server binary
    # and ships `mc` (used by scripts/devbox for bucket setup).
    image: bitnamilegacy/minio:latest
    user: "0"
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      # Browsers PUT to presigned URLs cross-origin; MinIO's API-level CORS
      # (not per-bucket) governs that — allow the local app origins.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_ROOT_USER: ${DEVBOX_S3_KEY:?set by scripts/devbox}
      MINIO_ROOT_PASSWORD: ${DEVBOX_S3_SECRET:?set by scripts/devbox}
    ports:
      - "127.0.0.1:${DEVBOX_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${DEVBOX_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
