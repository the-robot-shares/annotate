databaseChangeLog:
  # ── Annotate: refresh tokens (opaque, rotating, 30-day) ─────────

  - changeSet:
      id: annotate-0030-create-table-refresh-tokens
      author: annotate
      changes:
        - sql:
            sql: |
              CREATE TABLE refresh_tokens (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                commenter_id uuid NOT NULL REFERENCES commenters(id) ON DELETE CASCADE,
                site_id uuid REFERENCES sites(id) ON DELETE CASCADE,
                token_hash varchar(128) NOT NULL,
                expires_at timestamptz NOT NULL,
                revoked_at timestamptz,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL,
                CONSTRAINT refresh_tokens_token_hash_key UNIQUE (token_hash)
              );
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS refresh_tokens;

  - changeSet:
      id: annotate-0031-refresh-token-indexes
      author: annotate
      changes:
        - sql:
            sql: |
              CREATE INDEX refresh_tokens_commenter_id_index ON refresh_tokens (commenter_id);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS refresh_tokens_commenter_id_index;
