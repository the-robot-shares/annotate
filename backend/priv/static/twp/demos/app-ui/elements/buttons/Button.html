<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Button</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-8">
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Variants</p>
    <div class="flex flex-wrap gap-3">
      <button type="button" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500">Primary</button>
      <button type="button" class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs ring-1 ring-inset ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:ring-white/10 dark:hover:bg-white/20">Secondary</button>
      <button type="button" class="rounded-md bg-indigo-50 px-3 py-2 text-sm font-semibold text-indigo-600 hover:bg-indigo-100 dark:bg-indigo-500/10 dark:text-indigo-400">Soft</button>
      <button type="button" class="rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-red-500">Danger</button>
      <button type="button" class="rounded-md px-3 py-2 text-sm font-semibold text-gray-900 hover:bg-gray-50 dark:text-white dark:hover:bg-white/10">Ghost</button>
    </div>
  </div>
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Sizes</p>
    <div class="flex flex-wrap items-center gap-3">
      <button type="button" class="rounded bg-indigo-600 px-2 py-1 text-xs font-semibold text-white shadow-xs">xs</button>
      <button type="button" class="rounded-md bg-indigo-600 px-2.5 py-1.5 text-sm font-semibold text-white shadow-xs">sm</button>
      <button type="button" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs">md</button>
      <button type="button" class="rounded-md bg-indigo-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs">lg</button>
      <button type="button" class="rounded-md bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-xs">xl</button>
    </div>
  </div>
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Pill</p>
    <div class="flex flex-wrap gap-3">
      <button type="button" class="rounded-full bg-indigo-600 px-3.5 py-2 text-sm font-semibold text-white shadow-xs">Primary</button>
      <button type="button" class="rounded-full bg-white px-3.5 py-2 text-sm font-semibold text-gray-900 shadow-xs ring-1 ring-inset ring-gray-300 dark:bg-white/10 dark:text-white dark:ring-white/10">Secondary</button>
    </div>
  </div>
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Disabled</p>
    <button type="button" disabled class="cursor-not-allowed rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white opacity-50">Disabled</button>
  </div>
</div>
  </div>
</body>
</html>
