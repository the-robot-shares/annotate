<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RadioGroup</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-10 max-w-lg">
  <fieldset>
    <legend class="text-sm/6 font-semibold text-gray-900 dark:text-white">Notification method</legend>
    <div class="mt-4 space-y-3">
      <div class="flex items-center gap-x-3">
        <input id="email" name="notify" type="radio" checked class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-indigo-600 checked:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:border-white/10 dark:bg-white/5 dark:checked:border-indigo-500 dark:checked:bg-indigo-500"/>
        <label for="email" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Email</label>
      </div>
      <div class="flex items-center gap-x-3">
        <input id="sms" name="notify" type="radio" class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-indigo-600 checked:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:border-white/10 dark:bg-white/5 dark:checked:border-indigo-500 dark:checked:bg-indigo-500"/>
        <label for="sms" class="block text-sm/6 font-medium text-gray-900 dark:text-white">SMS</label>
      </div>
      <div class="flex items-center gap-x-3">
        <input id="push" name="notify" type="radio" class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-indigo-600 checked:bg-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:border-white/10 dark:bg-white/5 dark:checked:border-indigo-500 dark:checked:bg-indigo-500"/>
        <label for="push" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Push notification</label>
      </div>
    </div>
  </fieldset>
  <fieldset>
    <legend class="text-sm/6 font-semibold text-gray-900 dark:text-white">Pricing plan</legend>
    <p class="mt-1 text-sm/6 text-gray-600 dark:text-gray-400">Choose the plan that best fits your needs.</p>
    <div class="mt-4 space-y-4">
      <label class="relative flex cursor-pointer rounded-lg border border-gray-300 bg-white p-4 shadow-xs focus:outline-hidden dark:border-white/10 dark:bg-white/5">
        <input type="radio" name="plan" value="starter" class="mt-0.5 size-4 shrink-0 border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/10"/>
        <span class="ml-3 flex flex-col"><span class="block text-sm font-medium text-gray-900 dark:text-white">Starter</span><span class="mt-1 text-sm text-gray-500 dark:text-gray-400">Perfect for side projects and solo founders.</span></span>
      </label>
      <label class="relative flex cursor-pointer rounded-lg border border-indigo-600 bg-white p-4 shadow-xs ring-1 ring-indigo-600 dark:bg-white/5">
        <input type="radio" name="plan" value="pro" checked class="mt-0.5 size-4 shrink-0 border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/10"/>
        <span class="ml-3 flex flex-col"><span class="block text-sm font-medium text-gray-900 dark:text-white">Pro</span><span class="mt-1 text-sm text-gray-500 dark:text-gray-400">For growing teams that need more power.</span></span>
      </label>
      <label class="relative flex cursor-pointer rounded-lg border border-gray-300 bg-white p-4 shadow-xs dark:border-white/10 dark:bg-white/5">
        <input type="radio" name="plan" value="enterprise" class="mt-0.5 size-4 shrink-0 border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/10"/>
        <span class="ml-3 flex flex-col"><span class="block text-sm font-medium text-gray-900 dark:text-white">Enterprise</span><span class="mt-1 text-sm text-gray-500 dark:text-gray-400">Advanced controls and SLA guarantees.</span></span>
      </label>
    </div>
  </fieldset>
</div>
  </div>
</body>
</html>
