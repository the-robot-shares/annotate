<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ColorPicker09</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <fieldset><legend class="block text-sm/6 font-semibold text-gray-900 dark:text-white">Choose a label color</legend><div class="mt-6 flex items-center gap-x-3"><div class="flex rounded-full outline -outline-offset-1 outline-black/10"><input type="radio" aria-label="Pink" class="bg-pink-500 checked:outline-pink-500 size-8 appearance-none rounded-full forced-color-adjust-none checked:outline-2 checked:outline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-3" name="color" checked="" value="pink"/></div><div class="flex rounded-full outline -outline-offset-1 outline-black/10"><input type="radio" aria-label="Purple" class="bg-purple-500 checked:outline-purple-500 size-8 appearance-none rounded-full forced-color-adjust-none checked:outline-2 checked:outline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-3" name="color" value="purple"/></div><div class="flex rounded-full outline -outline-offset-1 outline-black/10"><input type="radio" aria-label="Blue" class="bg-blue-500 checked:outline-blue-500 size-8 appearance-none rounded-full forced-color-adjust-none checked:outline-2 checked:outline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-3" name="color" value="blue"/></div><div class="flex rounded-full outline -outline-offset-1 outline-black/10"><input type="radio" aria-label="Green" class="bg-green-500 checked:outline-green-500 size-8 appearance-none rounded-full forced-color-adjust-none checked:outline-2 checked:outline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-3" name="color" value="green"/></div><div class="flex rounded-full outline -outline-offset-1 outline-black/10"><input type="radio" aria-label="Yellow" class="bg-yellow-500 checked:outline-yellow-500 size-8 appearance-none rounded-full forced-color-adjust-none checked:outline-2 checked:outline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-3" name="color" value="yellow"/></div></div></fieldset>
  </div>
</body>
</html>
