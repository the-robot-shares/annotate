<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkbox</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-6 max-w-md">
  <fieldset>
    <legend class="text-sm/6 font-semibold text-gray-900 dark:text-white">Notifications</legend>
    <div class="mt-4 space-y-4">
      <div class="flex gap-3">
        <div class="flex h-6 shrink-0 items-center">
          <input id="comments" name="comments" type="checkbox" checked class="size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/10 dark:bg-white/5"/>
        </div>
        <div class="text-sm/6">
          <label for="comments" class="font-medium text-gray-900 dark:text-white">Comments</label>
          <p class="text-gray-500 dark:text-gray-400">Get notified when someone posts a comment.</p>
        </div>
      </div>
      <div class="flex gap-3">
        <div class="flex h-6 shrink-0 items-center">
          <input id="candidates" name="candidates" type="checkbox" class="size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/10 dark:bg-white/5"/>
        </div>
        <div class="text-sm/6">
          <label for="candidates" class="font-medium text-gray-900 dark:text-white">Candidates</label>
          <p class="text-gray-500 dark:text-gray-400">Get notified when a candidate applies.</p>
        </div>
      </div>
      <div class="flex gap-3">
        <div class="flex h-6 shrink-0 items-center">
          <input id="offers" name="offers" type="checkbox" class="size-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 dark:border-white/10 dark:bg-white/5"/>
        </div>
        <div class="text-sm/6">
          <label for="offers" class="font-medium text-gray-900 dark:text-white">Offers</label>
          <p class="text-gray-500 dark:text-gray-400">Get notified when a candidate accepts or rejects an offer.</p>
        </div>
      </div>
    </div>
  </fieldset>
</div>
  </div>
</body>
</html>
