<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toggle</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-8">
  <div class="flex items-center gap-x-3">
    <button type="button" role="switch" aria-checked="false" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-gray-200 transition-colors duration-200 ease-in-out focus:outline-hidden focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 dark:bg-white/10">
      <span class="pointer-events-none inline-block size-5 translate-x-0 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out"></span>
    </button>
    <span class="text-sm font-medium text-gray-900 dark:text-white">Off</span>
  </div>
  <div class="flex items-center gap-x-3">
    <button type="button" role="switch" aria-checked="true" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-indigo-600 transition-colors duration-200 ease-in-out focus:outline-hidden focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">
      <span class="pointer-events-none inline-block size-5 translate-x-5 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out"></span>
    </button>
    <span class="text-sm font-medium text-gray-900 dark:text-white">On</span>
  </div>
  <div class="flex items-center justify-between max-w-sm">
    <span class="flex grow flex-col">
      <span class="text-sm/6 font-medium text-gray-900 dark:text-white">Annual billing</span>
      <span class="text-sm text-gray-500 dark:text-gray-400">Save 20% with annual billing</span>
    </span>
    <button type="button" role="switch" aria-checked="true" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-indigo-600 transition-colors">
      <span class="pointer-events-none inline-block size-5 translate-x-5 transform rounded-full bg-white shadow-sm"></span>
    </button>
  </div>
</div>
  </div>
</body>
</html>
