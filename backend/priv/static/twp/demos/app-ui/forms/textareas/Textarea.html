<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Textarea</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="max-w-md space-y-6">
  <div>
    <label for="comment" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Add your comment</label>
    <div class="mt-2">
      <textarea rows="4" id="comment" name="comment" placeholder="Write a few sentences…" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10"></textarea>
    </div>
  </div>
  <div>
    <label for="bio" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Bio</label>
    <div class="mt-2">
      <textarea rows="3" id="bio" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10">I work on platform infrastructure and developer experience.</textarea>
    </div>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Write a few sentences about yourself.</p>
  </div>
</div>
  </div>
</body>
</html>
