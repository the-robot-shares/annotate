<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FileDetailsExample09</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  <div class="twp-root">
    
<div class="twp-overlay-demo relative min-h-[28rem]" data-open="true" data-twp-kind="drawer">
  <button type="button" data-twp-open class="rounded-md bg-gray-950/5 px-2.5 py-1.5 text-sm font-semibold text-gray-900 hover:bg-gray-950/10 dark:bg-white/10 dark:text-white dark:inset-ring dark:inset-ring-white/5 dark:hover:bg-white/20">Open drawer</button>
  <div data-twp-layer class="twp-overlay-layer absolute inset-0 z-10 overflow-hidden">
    <div data-twp-backdrop class="absolute inset-0 bg-gray-500/75 dark:bg-gray-900/50"></div>
    <div class="absolute inset-y-0 right-0 flex max-w-full pl-10 sm:pl-16 pointer-events-none">
      <div class="pointer-events-auto w-screen max-w-md h-full" role="dialog" aria-modal="true">
        
        <div class="relative flex h-full flex-col divide-y divide-gray-200 bg-white shadow-xl dark:divide-white/10 dark:bg-gray-800">
          <div class="flex min-h-0 flex-1 flex-col overflow-y-auto py-6">
            
      <div class="px-4 sm:px-6 ">
        <div class="flex items-start justify-between">
          <h2 class="text-base font-semibold text-gray-900 dark:text-white">File details</h2>
          <div class="ml-3 flex h-7 items-center">
            <button type="button" data-twp-close class="relative rounded-md text-gray-400 hover:text-gray-500 dark:hover:text-white">
              <span class="sr-only">Close panel</span>
              <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      </div>
            <div class="relative mt-6 flex-1 px-4 sm:px-6"><div class="space-y-3 text-sm">
  <p class="font-medium text-gray-900 dark:text-white">report-q4.pdf</p>
  <p class="text-gray-500 dark:text-gray-400">2.4 MB · Uploaded Jan 12, 2025</p>
  <p class="text-gray-500 dark:text-gray-400">Shared with 3 people</p>
</div></div>
          </div>
          <div class="flex shrink-0 justify-end gap-3 px-4 py-4">
            <button type="button" data-twp-close class="rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs ring-1 ring-inset ring-gray-300 hover:bg-gray-50 dark:bg-white/10 dark:text-white dark:ring-white/10">Cancel</button>
            <button type="button" data-twp-close class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  </div>
</body>
</html>
