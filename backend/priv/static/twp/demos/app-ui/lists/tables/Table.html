<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-8">
  <div class="flow-root">
    <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
        <table class="relative min-w-full divide-y divide-gray-300 dark:divide-white/15">
          <thead>
            <tr>
              <th scope="col" class="py-3.5 pr-3 pl-4 text-left text-sm font-semibold text-gray-900 sm:pl-0 dark:text-white">Name</th>
              <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 dark:text-white">Role</th>
              <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 dark:text-white">Status</th>
              <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900 dark:text-white">Joined</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-white/10">
            <tr>
              <td class="py-4 pr-3 pl-4 text-sm font-medium whitespace-nowrap text-gray-900 sm:pl-0 dark:text-white">Alice Nguyen</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Engineer</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Active</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">2023-01</td>
            </tr>
            <tr>
              <td class="py-4 pr-3 pl-4 text-sm font-medium whitespace-nowrap text-gray-900 sm:pl-0 dark:text-white">Bob Martinez</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Designer</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Active</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">2022-07</td>
            </tr>
            <tr>
              <td class="py-4 pr-3 pl-4 text-sm font-medium whitespace-nowrap text-gray-900 sm:pl-0 dark:text-white">Carol Smith</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Manager</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Away</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">2021-03</td>
            </tr>
            <tr>
              <td class="py-4 pr-3 pl-4 text-sm font-medium whitespace-nowrap text-gray-900 sm:pl-0 dark:text-white">David Lee</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Engineer</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">Inactive</td>
              <td class="px-3 py-4 text-sm whitespace-nowrap text-gray-500 dark:text-gray-400">2020-11</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
  </div>
</body>
</html>
