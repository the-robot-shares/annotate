<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StackedList</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-10 max-w-lg">
  <ul role="list" class="divide-y divide-gray-100 dark:divide-white/10">
    <li class="flex justify-between gap-x-6 py-5">
      <div class="flex min-w-0 gap-x-4">
        <span class="inline-flex size-10 shrink-0 items-center justify-center rounded-full bg-gray-100 text-sm font-medium text-gray-600 dark:bg-white/10 dark:text-gray-300">AN</span>
        <div class="min-w-0 flex-auto">
          <p class="text-sm/6 font-semibold text-gray-900 dark:text-white">Alice Nguyen</p>
          <p class="mt-1 truncate text-xs/5 text-gray-500 dark:text-gray-400">alice@example.com</p>
        </div>
      </div>
      <div class="hidden shrink-0 sm:flex sm:flex-col sm:items-end">
        <p class="text-sm/6 text-gray-900 dark:text-white">Admin</p>
      </div>
    </li>
    <li class="flex justify-between gap-x-6 py-5">
      <div class="flex min-w-0 gap-x-4">
        <span class="inline-flex size-10 shrink-0 items-center justify-center rounded-full bg-gray-100 text-sm font-medium text-gray-600 dark:bg-white/10 dark:text-gray-300">BM</span>
        <div class="min-w-0 flex-auto">
          <p class="text-sm/6 font-semibold text-gray-900 dark:text-white">Bob Martinez</p>
          <p class="mt-1 truncate text-xs/5 text-gray-500 dark:text-gray-400">bob@example.com</p>
        </div>
      </div>
      <div class="hidden shrink-0 sm:flex sm:flex-col sm:items-end">
        <p class="text-sm/6 text-gray-900 dark:text-white">Member</p>
      </div>
    </li>
    <li class="flex justify-between gap-x-6 py-5">
      <div class="flex min-w-0 gap-x-4">
        <span class="inline-flex size-10 shrink-0 items-center justify-center rounded-full bg-gray-100 text-sm font-medium text-gray-600 dark:bg-white/10 dark:text-gray-300">CS</span>
        <div class="min-w-0 flex-auto">
          <p class="text-sm/6 font-semibold text-gray-900 dark:text-white">Carol Smith</p>
          <p class="mt-1 truncate text-xs/5 text-gray-500 dark:text-gray-400">carol@example.com</p>
        </div>
      </div>
      <div class="hidden shrink-0 sm:flex sm:flex-col sm:items-end">
        <p class="text-sm/6 text-gray-900 dark:text-white">Viewer</p>
      </div>
    </li>
  </ul>
  <ul role="list" class="divide-y divide-gray-100 dark:divide-white/10">
    <li class="py-4"><p class="text-sm font-medium text-gray-900 dark:text-white">Project Alpha</p><p class="text-sm text-gray-500 dark:text-gray-400">Due Jan 15</p></li>
    <li class="py-4"><p class="text-sm font-medium text-gray-900 dark:text-white">Project Beta</p><p class="text-sm text-gray-500 dark:text-gray-400">Due Feb 3</p></li>
    <li class="py-4"><p class="text-sm font-medium text-gray-900 dark:text-white">Project Gamma</p><p class="text-sm text-gray-500 dark:text-gray-400">Due Mar 20</p></li>
  </ul>
</div>
  </div>
</body>
</html>
