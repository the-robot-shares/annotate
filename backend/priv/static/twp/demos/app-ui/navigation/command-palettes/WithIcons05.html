<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WithIcons05</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="relative min-h-[28rem]">
  <div class="absolute inset-0 bg-gray-500/25 dark:bg-gray-900/50"></div>
  <div class="relative z-10 flex min-h-[28rem] items-start justify-center p-4 sm:p-6 md:p-10">
    <div class="w-full max-w-xl divide-y divide-gray-100 overflow-hidden rounded-xl bg-white shadow-2xl outline outline-1 outline-black/5 dark:divide-white/10 dark:bg-gray-900 dark:outline-white/10">
      <div class="grid grid-cols-1">
        <input type="text" class="col-start-1 row-start-1 h-12 w-full border-0 bg-transparent pr-4 pl-11 text-base text-gray-900 outline-none placeholder:text-gray-400 sm:text-sm dark:text-white dark:placeholder:text-gray-500" placeholder="Search..." value="Les" readonly />
        <svg class="pointer-events-none col-start-1 row-start-1 ml-4 size-5 self-center text-gray-400 dark:text-gray-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"/></svg>
      </div>
      <ul class="max-h-72 scroll-py-2 overflow-y-auto py-2 text-sm text-gray-800 dark:text-gray-300">
        <li class="cursor-default bg-indigo-600 px-4 py-2 text-white select-none">Leslie Alexander</li>
        <li class="cursor-default px-4 py-2 select-none hover:bg-gray-100 dark:hover:bg-white/5">Leslie Ankunding</li>
        <li class="cursor-default px-4 py-2 select-none hover:bg-gray-100 dark:hover:bg-white/5">Leslie Kutch</li>
      </ul>
      <div class="flex flex-wrap items-center bg-gray-50 px-4 py-2.5 text-xs text-gray-700 dark:bg-gray-800/50 dark:text-gray-300">
        <kbd class="mx-1 flex size-5 items-center justify-center rounded border border-gray-400 bg-white font-semibold text-gray-900 sm:mx-2 dark:border-gray-600 dark:bg-gray-700 dark:text-white">↵</kbd>
        <span class="sm:hidden">to select</span>
        <span class="hidden sm:inline">to select</span>
        <kbd class="mx-1 flex size-5 items-center justify-center rounded border border-gray-400 bg-white font-semibold text-gray-900 sm:mx-2 dark:border-gray-600 dark:bg-gray-700 dark:text-white">↑</kbd>
        <kbd class="mx-1 flex size-5 items-center justify-center rounded border border-gray-400 bg-white font-semibold text-gray-900 sm:mx-2 dark:border-gray-600 dark:bg-gray-700 dark:text-white">↓</kbd>
        <span class="hidden sm:inline">to navigate</span>
        <kbd class="mx-1 flex size-5 items-center justify-center rounded border border-gray-400 bg-white font-semibold text-gray-900 sm:mx-2 dark:border-gray-600 dark:bg-gray-700 dark:text-white">esc</kbd>
        <span class="hidden sm:inline">to close</span>
      </div>
    </div>
  </div>
</div>
  </div>
</body>
</html>
