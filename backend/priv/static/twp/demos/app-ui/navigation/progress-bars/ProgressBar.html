<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProgressBar</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-8 max-w-md">
  <div>
    <div class="flex justify-between text-sm font-medium text-gray-900 dark:text-white"><span>Migrating MySQL database…</span><span>40%</span></div>
    <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-white/10">
      <div class="h-2 rounded-full bg-indigo-600" style="width:40%"></div>
    </div>
  </div>
  <div>
    <div class="flex justify-between text-sm font-medium text-gray-900 dark:text-white"><span>Uploading files…</span><span>75%</span></div>
    <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-white/10">
      <div class="h-2 rounded-full bg-green-600" style="width:75%"></div>
    </div>
  </div>
  <div>
    <div class="flex justify-between text-sm font-medium text-gray-900 dark:text-white"><span>Complete</span><span>100%</span></div>
    <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-gray-200 dark:bg-white/10">
      <div class="h-2 rounded-full bg-indigo-600" style="width:100%"></div>
    </div>
  </div>
</div>
  </div>
</body>
</html>
