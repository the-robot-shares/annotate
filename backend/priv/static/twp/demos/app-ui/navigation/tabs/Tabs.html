<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabs</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-10">
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500">Underline</p>
    <div class="border-b border-gray-200 dark:border-white/10">
      <nav class="-mb-px flex space-x-8" aria-label="Tabs">
        <a href="#" class="border-indigo-500 text-indigo-600 border-b-2 px-1 py-4 text-sm font-medium whitespace-nowrap dark:text-indigo-400" aria-current="page">Overview</a>
        <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 border-b-2 px-1 py-4 text-sm font-medium whitespace-nowrap dark:text-gray-400 dark:hover:text-gray-200">Activity</a>
        <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 border-b-2 px-1 py-4 text-sm font-medium whitespace-nowrap dark:text-gray-400 dark:hover:text-gray-200">Settings</a>
        <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 border-b-2 px-1 py-4 text-sm font-medium whitespace-nowrap dark:text-gray-400 dark:hover:text-gray-200">Billing</a>
      </nav>
    </div>
  </div>
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500">Pills</p>
    <nav class="flex space-x-4" aria-label="Tabs">
      <a href="#" class="rounded-md bg-indigo-100 px-3 py-2 text-sm font-medium text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300" aria-current="page">Overview</a>
      <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Activity</a>
      <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Settings</a>
      <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Billing</a>
    </nav>
  </div>
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500">Bordered</p>
    <div class="border-b border-gray-200 dark:border-white/10">
      <nav class="-mb-px flex space-x-4" aria-label="Tabs">
        <a href="#" class="rounded-t-md border border-b-0 border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-900 dark:border-white/10 dark:bg-gray-900 dark:text-white" aria-current="page">Overview</a>
        <a href="#" class="rounded-t-md border border-transparent px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400">Activity</a>
        <a href="#" class="rounded-t-md border border-transparent px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 dark:text-gray-400">Settings</a>
      </nav>
    </div>
  </div>
</div>
  </div>
</body>
</html>
