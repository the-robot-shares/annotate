<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DescriptionList</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="space-y-10">
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Default</p>
    <dl class="divide-y divide-gray-100 dark:divide-white/10">
      <div class="px-0 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Full name</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Margaret Atwood</dd>
      </div>
      <div class="px-0 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Email</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">margaret@example.com</dd>
      </div>
      <div class="px-0 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Role</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Senior Engineer</dd>
      </div>
      <div class="px-0 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Department</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Platform Infrastructure</dd>
      </div>
      <div class="px-0 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Location</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Toronto, ON</dd>
      </div>
      <div class="px-0 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Status</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">
          <span class="inline-flex items-center rounded-md bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20 dark:bg-green-500/10 dark:text-green-400 dark:ring-green-500/20">Active</span>
        </dd>
      </div>
    </dl>
  </div>
  <div>
    <p class="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Striped</p>
    <dl class="divide-y divide-gray-100 dark:divide-white/10">
      <div class="bg-gray-50 px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 dark:bg-white/5">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Full name</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Margaret Atwood</dd>
      </div>
      <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Email</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">margaret@example.com</dd>
      </div>
      <div class="bg-gray-50 px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4 dark:bg-white/5">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Role</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Senior Engineer</dd>
      </div>
      <div class="px-4 py-4 sm:grid sm:grid-cols-3 sm:gap-4">
        <dt class="text-sm font-medium text-gray-900 dark:text-gray-100">Department</dt>
        <dd class="mt-1 text-sm text-gray-700 sm:col-span-2 sm:mt-0 dark:text-gray-300">Platform Infrastructure</dd>
      </div>
    </dl>
  </div>
</div>
  </div>
</body>
</html>
