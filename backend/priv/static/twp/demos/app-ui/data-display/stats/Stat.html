<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stat</title>
  <link rel="stylesheet" href="/twp/demo-bridge.css" />
  <script src="/twp/demo-bridge.js"></script>
</head>
<body class="h-full">
  
  <div class="twp-root">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm ring-1 ring-gray-900/5 sm:p-6 dark:bg-gray-800/50 dark:ring-white/10">
    <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Total Revenue</dt>
    <dd class="mt-1 flex items-baseline gap-2">
      <span class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">$48,295</span>
      <span class="text-sm font-medium text-green-600 dark:text-green-400">↑ 12% this month</span>
    </dd>
  </div>
  <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm ring-1 ring-gray-900/5 sm:p-6 dark:bg-gray-800/50 dark:ring-white/10">
    <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Active Users</dt>
    <dd class="mt-1 flex items-baseline gap-2">
      <span class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">3,842</span>
      <span class="text-sm font-medium text-red-600 dark:text-red-400">↓ 4% this week</span>
    </dd>
  </div>
  <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm ring-1 ring-gray-900/5 sm:p-6 dark:bg-gray-800/50 dark:ring-white/10">
    <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Conversion Rate</dt>
    <dd class="mt-1 flex items-baseline gap-2">
      <span class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">5.27%</span>
      <span class="text-sm font-medium text-green-600 dark:text-green-400">↑ 0.8% this month</span>
    </dd>
  </div>
  <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm ring-1 ring-gray-900/5 sm:p-6 dark:bg-gray-800/50 dark:ring-white/10">
    <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Avg. Order Value</dt>
    <dd class="mt-1 text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">$124</dd>
  </div>
  <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm ring-1 ring-gray-900/5 sm:p-6 dark:bg-gray-800/50 dark:ring-white/10">
    <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Uptime</dt>
    <dd class="mt-1 text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">99.9%</dd>
  </div>
  <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow-sm ring-1 ring-gray-900/5 sm:p-6 dark:bg-gray-800/50 dark:ring-white/10">
    <dt class="truncate text-sm font-medium text-gray-500 dark:text-gray-400">Support Tickets</dt>
    <dd class="mt-1 flex items-baseline gap-2">
      <span class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">17</span>
      <span class="text-sm font-medium text-green-600 dark:text-green-400">↑ 3 since yesterday</span>
    </dd>
  </div>
</div>
  </div>
</body>
</html>
