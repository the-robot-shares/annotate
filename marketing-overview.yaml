    proof: docs/MCP.md (scopes, step-up consent, revoke at /dashboard/agents, audit table 037); mcp_server_page.ex
  - audience_id: agent_first_teams
    claim: Visitor text is returned only under `untrusted` keys so agents treat it as data.
    proof: docs/MCP.md "Untrusted content"; MCP.md tools table; llms.txt agent section

