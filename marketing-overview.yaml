  - audience_id: agency_devs
    claim: Feedback arrives pinned to the exact element, with anchor and page context attached.
    proof: docs/ANCHORS.md (multi-strategy anchor v2, re-find, deep links); landing 7-step demo frames
  - audience_id: agency_devs
    claim: Install is one script tag and one custom element.
    proof: docs/EMBED-AUTH.md § 0; landing_page.ex snippet section; WidgetCdn latest/pinned loaders
  - audience_id: agency_devs
    claim: A leaked key only works on the origins you register.
    proof: sites.ex per-site allowed_origins (max 20); EMBED-AUTH origin-bound tokens; CORS plug
  - audience_id: product_teams
    claim: Comments survive redesigns and re-find their element.
    proof: ANCHORS.md resolution order + orphan detection; "Anchor that survives" tile
  - audience_id: product_teams
    claim: Reviewers never need an annotate account to read; posting can use your own sign-in or host-vouching.
    proof: EMBED-AUTH popup broker + host-assert; sites.ex allow_anonymous / trust_host_roles; public read default
  - audience_id: agent_first_teams
