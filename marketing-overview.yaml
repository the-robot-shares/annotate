demo:
  url: https://annotate.therobotlives.com
  environment: prod
  how_to_access: >-
    Open the landing page — it dogfoods the live widget. Reading needs no
    account. Posting on the demo site requires sign-in (Authentik popup);
    anonymous posting is off there.
  credentials_ref: none   # no credentials used or needed for the public demo; never store demo creds here
  script_steps:
    - "Land on the page: the collapsed comment pill sits on the right rail (the real widget, CDN-pinned)."
    - "Click 'Try it on this page' — the widget arms pick mode; a dashed ring follows the cursor."
    - "Click any element or select text — the composer opens anchored, quoting the pick."
    - "Crop a screenshot, draw on it (box/arrow/pen/text/blur), or attach a file — uploads run while typing and retry on failure."
    - "Post (sign-in popup) — the thread appears in the rail and syncs live to other open sessions."
    - "Switch hats to the site owner: the dashboard inbox shows the thread with anchor, page context, and attachments — reply as the site team, resolve or reopen."
    - "Agent leg: `claude mcp add --transport http annotate https://annotate.therobotlives.com/mcp`, OAuth sign-in, then list_threads → get_thread → reply_to_thread → resolve_thread."
  key_flows:
    - pick → compose → post → rail (visitor loop)
    - inbox → reply → resolve → page shows settled (owner loop)
    - list_threads → investigate → patch → reply → resolve (agent loop)
  aha_moment: >-
    The ring. Open any comment and the exact element rings on the page —
    "points at the thing" made physical. Second aha: an agent answers the
    thread and the visitor sees it live.
  duration: 60-90s scripted; the live-widget moment is immediate
  video_url: null   # none yet — PROOF NEEDED
  reset_notes: >-
    Demo-site comments are production data on a public-read site; the demo
    reads clean because visitors self-moderate — no reset flow exists. Keep
    scripted comments clearly labelled as demo posts.
  known_gotchas:
    - Posting needs sign-in on the demo site (anonymous off); reading is open — say so near the CTA or the click feels broken.
    - Pick mode arms only after the widget bootstraps; the CTA polls ~2s before the ring appears — on a cold cache there is a beat of nothing.
    - Demo-site comments are publicly readable — never post anything sensitive while demoing.
    - Rail docks right on desktop, bottom sheet on mobile.
    - Hero art (hero-loop) depicts a "ticket" step; ticket push is PLANNED. Alt text and captions must not claim tickets ship.

ctas:
  primary: Try it on this page
  # flow: account → sign in → add site domain → script tag issued for that domain
  secondary: Start free

brand:
  voice_summary: >-
    A senior developer explaining a tool they actually use: short declarative
    sentences, concrete verbs, numbers over adjectives, claims limited to
    shipped behavior, planned features labeled "Planned". Dry humor at most,
    never in a claim.
  visual_refs:
    - design/landing/DIRECTIONS.md (Margin / Night Desk / Red Pen / Proof Sheet)
    - design/landing/CRITIQUE.md (render ranking; Night Desk 8.5 leads)
    - og.png = 1200x630 crop of hero-loop art
  styleguide: app design system (Inter + JetBrains Mono seeds); see DIRECTIONS.md pairing notes
  do_not_say:
    - seamless
    - effortless
    - game-changing / game-changer
    - revolutionary
    - supercharge
    - AI-powered
    - "we're excited to announce"
    - 'ticket created in Jira (planned, not shipped)'

