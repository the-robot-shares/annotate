open_questions:
  - question: >-
      seo.ex moduledoc and llms.txt/llms-full.txt say "no pricing / none
      published", but /pricing ships with Stripe checkout, 14-day trial, and
      plan tiers. Which is authoritative — and may the .ex lane update the
      llms_* pricing lines to match the shipped pricing page?
    raised_by: marketing copy lane
    date: 2026-10-18
  - question: >-
      Dashboard signup is invite-gated (invite_required_page, limited plan
      batches). Should landing copy say "request an invite", or keep the plain
      GitHub sign-in button and let the gate speak for itself?
    raised_by: marketing copy lane
    date: 2026-10-18
  - question: >-
      Confirm agency/freelance developers as the primary audience (chosen for
      controlling install + owning triage). Alternative: lead with product/
      design teams (bigger review-round pain, less technical page).
    raised_by: marketing copy lane
    date: 2026-10-18
  - question: >-
      Hero illustration (hero-loop) renders the ticket step that is still
      planned. Re-render art without the ticket, keep it with a "planned"
      caption, or accept as aspirational with honest alt text?
    raised_by: marketing copy lane
    date: 2026-10-18

