      teams) is derived from what the product does, not from user research.
    appears_in: audiences[]
    date: 2026-10-18
  - assumption: Stage is private_beta (invite gate on dashboard access, plan batches limited) — inferred from code, not announced anywhere.
    appears_in: product.stage
    date: 2026-10-18
  - assumption: >-
      Awareness stage problem-aware for the two human audiences (they feel
      feedback pain; few know element-anchored tools exist).
    appears_in: audiences[].awareness_stage
    date: 2026-10-18
  - assumption: No test personas or complaint-mining corpus exists yet; voice cards need a review pass once real visitor/support language lands.
    appears_in: audiences[].voice
    date: 2026-10-18
