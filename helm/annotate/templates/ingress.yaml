{{- if .Values.ingress.enabled }}
{{- $svcName := ternary (printf "%s-sandbox" (include "annotate.fullname" .)) (include "annotate.fullname" .) (.Values.sandbox.enabled | default false) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "annotate.fullname" . }}
  labels:
    {{- include "annotate.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.cloudflareOnly }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ include "annotate.cloudflareWhitelist" . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.domain }}
    {{- if .Values.appDomain }}
    - {{ .Values.appDomain }}
    {{- end }}
    secretName: {{ .Values.tls.secretName }}
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /auth/verify
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      - path: /auth/verify-email
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      - path: /auth/sso-callback
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      # Hologram page under /auth/*: must not fall to the /auth prefix rule
      # (Phoenix /auth/:provider) when frontend and backend ports differ.
      - path: /auth/invite-required
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /health
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /sso
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
  {{- if .Values.appDomain }}
  - host: {{ .Values.appDomain }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /health
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /auth/verify
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      - path: /auth/verify-email
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      - path: /auth/sso-callback
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      # Hologram page under /auth/*: must not fall to the /auth prefix rule
      # (Phoenix /auth/:provider) when frontend and backend ports differ.
      - path: /auth/invite-required
        pathType: Exact
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /sso
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.backend.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $svcName }}
            port:
              number: {{ .Values.frontend.port }}
  {{- end }}
{{- end }}
