apiVersion: v1
kind: Service
metadata:
  name: {{ include "annotate.fullname" . }}
  labels:
    {{- include "annotate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: backend
    port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}
    protocol: TCP
  - name: frontend
    port: {{ .Values.frontend.port }}
    targetPort: {{ .Values.frontend.port }}
    protocol: TCP
  selector:
    {{- include "annotate.selectorLabels" . | nindent 4 }}
