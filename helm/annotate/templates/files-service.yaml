{{- if .Values.files.enabled }}
# S3 API only (no console port).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "annotate.fullname" . }}-files
  labels:
    {{- include "annotate.labels" . | nindent 4 }}
    app.kubernetes.io/component: files
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    {{- include "annotate.filesSelectorLabels" . | nindent 4 }}
  ports:
  - name: api
    port: 9000
    targetPort: api
{{- end }}
