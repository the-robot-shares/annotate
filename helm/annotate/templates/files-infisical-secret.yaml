{{- if .Values.files.enabled }}
{{- $inf := .Values.tls.infisical }}
# Root creds + app key pair for the dedicated annotate MinIO, from Infisical
# {{ .Values.files.infisicalPath }}. Consumed only by the files Deployment and
# the files-bootstrap hook — never by the app pod.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "annotate.fullname" . }}-files-secrets
  labels:
    {{- include "annotate.labels" . | nindent 4 }}
    app.kubernetes.io/component: files
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  hostAPI: {{ $inf.hostAPI }}
  resyncInterval: {{ $inf.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ $inf.credentialsSecret }}
        secretNamespace: {{ $inf.credentialsNamespace }}
      secretsScope:
        projectSlug: {{ $inf.projectSlug }}
        envSlug: {{ $inf.envSlug }}
        secretsPath: {{ .Values.files.infisicalPath | quote }}
  managedSecretReference:
    secretName: {{ .Values.files.secretName }}
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Owner
    template:
      includeAllSecrets: true
{{- end }}
