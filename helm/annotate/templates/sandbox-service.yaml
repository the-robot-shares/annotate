{{- if .Values.sandbox.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "annotate.fullname" . }}-sandbox
  labels:
    {{- include "annotate.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  type: {{ .Values.sandbox.service.type | default "ClusterIP" }}
  ports:
  - name: smb
    port: 445
    targetPort: smb
    protocol: TCP
  - name: frontend
    port: 3000
    targetPort: frontend
    protocol: TCP
  - name: backend
    port: 4000
    targetPort: backend
    protocol: TCP
  selector:
    {{- include "annotate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
{{- end }}
