replicas: 1
# Deployment strategy. Recreate: MCP sessions are node-local (see deployment.yaml).
strategy: Recreate
domain: annotate.therobotlives.com
appDomain: annotate-srv.therobotlives.com
# appDomain is a sibling subdomain (not a child of domain), so the auth cookie
# must be scoped to the shared parent zone for the OIDC/session flow to work
# across both hosts. Defaults to ".{domain}" when unset.
cookieDomain: ".therobotlives.com"

backend:
  image: ops.noizu.com/annotate.therobotlives.com/backend:sha-de0d0ba
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The frontend IS the Phoenix+Hologram backend (no separate container/image),
# so there is no `frontend` stanza and no second Service port: a duplicated
# port number makes the Service invalid and ArgoCD cannot apply it (annotate
# fell back to a hand-applied Service). Ingress routes every path to
# backend.port.

migrate:
  enabled: true
  command: ["bin/annotate", "eval", "Annotate.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: annotate

redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  # db 16 — per-app logical db (foryou=15, startapp=7, drafts=11, learns=14…)
  db: 16

fleetIngest:
  # Fleet dashboard ingest endpoint for the daily FleetPush push.
  url: "https://fleet.noizu.com/api/v1/ingest/metrics"

secrets:
  # Materialized by the InfisicalSecret CR (monorepo apps/init annotate-site.tf)
  # syncing /apps/annotate.
  name: annotate-secrets
  keys:
    dbUser: ANNOTATE_DB_USER
    dbPassword: ANNOTATE_DB_PASSWORD
    databaseUrl: ANNOTATE_DATABASE_URL
    secretKeyBase: ANNOTATE_SECRET_KEY_BASE
    guardianSecretKey: ANNOTATE_GUARDIAN_SECRET_KEY
    sessionSigningSalt: ANNOTATE_SESSION_SIGNING_SALT
    jwtSecret: ANNOTATE_JWT_SECRET
    keyEncSecret: ANNOTATE_KEY_ENC_SECRET
    redisUrl: ANNOTATE_REDIS_URL
    # MCP OAuth (annotate /mcp) access-token signing key — MCP-only, never
    # the embed jwtSecret.
    mcpSigningSecret: ANNOTATE_MCP_SIGNING_SECRET
    # Fleet dashboard (fleet.noizu.com) daily ingest bearer key. Optional
    # secretKeyRef in _helpers.tpl: until it lands in the synced secret the
    # pod boots without it and FleetPush no-ops (logs once).
    fleetIngestKey: ANNOTATE_FLEET_INGEST_KEY
    sendgridApiKey: ""
    oidcClientId: ANNOTATE_OIDC_CLIENT_ID
    oidcClientSecret: ANNOTATE_OIDC_CLIENT_SECRET
    # App-scoped key for the dedicated annotate MinIO (`files:` below) —
    # bucket `annotate` only. The legacy shared-MinIO pair (AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY, monorepo kubernetes/init annotate-minio.tf) stays
    # in the Secret as the rollback path; point these back at it to revert.
    awsAccessKeyId: ANNOTATE_FILES_ACCESS_KEY_ID
    awsSecretAccessKey: ANNOTATE_FILES_SECRET_ACCESS_KEY
    # Dashboard sign-in (Google OAuth client; Infisical ANNOTATE_GOOGLE_*).
    # Optional secretKeyRefs: "not configured" until populated.
    googleClientId: ANNOTATE_GOOGLE_CLIENT_ID
    googleClientSecret: ANNOTATE_GOOGLE_CLIENT_SECRET
    facebookClientId: ""
    facebookClientSecret: ""
    # Dashboard sign-in (GitHub OAuth App; dc services apps.annotate_github_*).
    # Optional secretKeyRefs: the pod boots before the keys are populated and
    # the UI shows "GitHub sign-in is not configured yet".
    githubClientId: ANNOTATE_GITHUB_CLIENT_ID
    githubClientSecret: ANNOTATE_GITHUB_CLIENT_SECRET
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  # SSO availability by email domain. Format:
  # "example.com=oidc;corp.example=google,oidc"
  domains: ""
  # Domains whose SSO registrations are approved immediately. All other SSO
  # registrations remain pending unless an invite activates them. Format:
  # "example.com;corp.example" or "*" for every SSO-enabled domain.
  autoApproveDomains: ""
  oidc:
    # Default OIDC issuer for portfolio services (Authentik at auth.derobot.is)
    issuer: "https://auth.derobot.is/application/o/annotate"
    # Redirect registered on the Authentik client. The embed auth broker is the
    # primary flow for this app (popup broker on the API host); the site SSO
    # callback (https://annotate.therobotlives.com/auth/oidc/callback) is also
    # registered on the same client.
    redirectUri: "https://annotate-srv.therobotlives.com/embed/callback"
  saml:
    # Samly 1.4 expects raw metadata XML or a local metadata file path; it does
    # not fetch metadata URLs at runtime.
    idpMetadata: ""
    idpMetadataFile: ""
    # Deprecated. Kept for existing values files that used this as a file path.
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: "G-477J8HGX4M"  # vnext_sites annotate_therobotlives_com.google-analytics.tracker (public id)
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true
  # /mcp (Streamable HTTP): responses may be long-lived SSE streams. A second
  # Ingress object for the one path carries the annotations nginx needs —
  # no response buffering, long read/send timeouts. Same host, same TLS.
  mcp:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

tls:
  enabled: true
  secretName: therobotlives-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotlives"
    crtKey: THEROBOTLIVES_TLS_CRT
    keyKey: THEROBOTLIVES_TLS_KEY

# OpenTelemetry → SigNoz wiring (conventions: trl-infra docs/observability/
# OTEL-CONVENTIONS.md). enabled=false ships NO OTEL_* env vars at all, so the
# runtime no-ops (SDK disabled, zero connection attempts).
otel:
  enabled: true
  # The fleet site key — MUST equal the site's entry in the fleet repo's
  # app/priv/sites.yml (generated from docs/site-fleet/REGISTRY.md); SigNoz
  # deep-links key off it exactly (https://apm.noizu.com/services/<key>).
  # "annotate-app" is this scaffold's template placeholder.
  fleetSiteKey: "annotate-app"
  collectorEndpoint: "http://signoz-otel-collector.infra.svc:4318"
  protocol: "http/protobuf"
  sampler: "parentbased_traceidratio"
  samplerArg: "1.0"
  serviceNamespace: "portfolio"
  # deployment.environment: prod | stage | dev per conventions; empty falls
  # back to the release namespace.
  deploymentEnvironment: ""
  # service.version: deployed image sha/tag; empty falls back to the tag part
  # of backend.image.
  serviceVersion: ""

storage:
  # Bucket `annotate` on the dedicated annotate MinIO (`files:` below).
  # Credentials: ANNOTATE_FILES_ACCESS_KEY_ID / ANNOTATE_FILES_SECRET_ACCESS_KEY
  # in /apps/annotate (synced into annotate-secrets).
  enabled: true
  bucket: "annotate"
  region: "us-east-1"
  # In-cluster endpoint for server-side calls (media get/put, deletes).
  endpoint: "http://annotate-files.apps.svc.cluster.local:9000"
  scheme: "http://"
  # Browser-reachable endpoint presigned upload/download urls are signed for
  # (the widget PUTs attachments straight to it). The in-cluster endpoint
  # above never resolves from a browser. Empty = sign for `endpoint`.
  publicEndpoint: "https://annotate-files.therobotlives.com"

# Dedicated single-node MinIO for annotate (replaces the shared
# minio.noizu.com bucket). S3 API only, at `files.host` behind Cloudflare
# (single-level subdomain so the *.therobotlives.com edge + origin certs cover
# it). Console is disabled (MINIO_BROWSER=off) and never exposed.
# Root creds + the app key pair come from Infisical /apps/annotate-files
# (synced into `files.secretName` by templates/files-infisical-secret.yaml).
# The files-bootstrap Sync hook creates the bucket (private, no anonymous
# policy) and the bucket-scoped app user before the app rolls.
files:
  enabled: true
  host: annotate-files.therobotlives.com
  image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  # quay.io 401s fresh anonymous pulls: pin to the node with the image cached
  # (same pin as the shared MinIO and app-valkey).
  nodeSelector:
    kubernetes.io/hostname: noizu-server
  secretName: annotate-files-secrets
  infisicalPath: /apps/annotate-files
  # Presigned urls are the only access path (private bucket), so CORS is
  # open to any origin: the widget uploads from arbitrary embedding sites.
  # Same as the shared MinIO's default (cors_allow_origin=*).
  corsAllowOrigin: "*"
  appPolicyName: annotate-app
  persistence:
    size: 20Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "25m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/annotate/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
