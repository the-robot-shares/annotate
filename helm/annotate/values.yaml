replicas: 1
domain: annotate.therobotlives.com
appDomain: annotate-srv.therobotlives.com
# appDomain is a sibling subdomain (not a child of domain), so the auth cookie
# must be scoped to the shared parent zone for the OIDC/session flow to work
# across both hosts. Defaults to ".{domain}" when unset.
cookieDomain: ".therobotlives.com"

backend:
  image: ops.noizu.com/annotate.therobotlives.com/backend:sha-7d94350
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The frontend IS the Phoenix+Hologram backend (no separate container/image),
# so there is no `frontend` stanza and no second Service port: a duplicated
# port number makes the Service invalid and ArgoCD cannot apply it (annotate
# fell back to a hand-applied Service). Ingress routes every path to
# backend.port.

migrate:
  enabled: true
  command: ["bin/annotate", "eval", "Annotate.Release.migrate()"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb.apps.svc.cluster.local
  port: 5432
  name: annotate

redis:
  host: app-valkey.apps.svc.cluster.local
  port: 6379
  # db 16 — per-app logical db (foryou=15, startapp=7, drafts=11, learns=14…)
  db: 16

fleetIngest:
  # Fleet dashboard ingest endpoint for the daily FleetPush push.
  url: "https://fleet.noizu.com/api/v1/ingest/metrics"

secrets:
  # Materialized by the InfisicalSecret CR (monorepo apps/init annotate-site.tf)
  # syncing /apps/annotate.
  name: annotate-secrets
  keys:
    dbUser: ANNOTATE_DB_USER
    dbPassword: ANNOTATE_DB_PASSWORD
    databaseUrl: ANNOTATE_DATABASE_URL
    secretKeyBase: ANNOTATE_SECRET_KEY_BASE
    guardianSecretKey: ANNOTATE_GUARDIAN_SECRET_KEY
    sessionSigningSalt: ANNOTATE_SESSION_SIGNING_SALT
    jwtSecret: ANNOTATE_JWT_SECRET
    keyEncSecret: ANNOTATE_KEY_ENC_SECRET
    redisUrl: ANNOTATE_REDIS_URL
    # Fleet dashboard (fleet.noizu.com) daily ingest bearer key. Optional
    # secretKeyRef in _helpers.tpl: until it lands in the synced secret the
    # pod boots without it and FleetPush no-ops (logs once).
    fleetIngestKey: ANNOTATE_FLEET_INGEST_KEY
    sendgridApiKey: ""
    oidcClientId: ANNOTATE_OIDC_CLIENT_ID
    oidcClientSecret: ANNOTATE_OIDC_CLIENT_SECRET
    # MinIO bucket `annotate` scoped user (monorepo kubernetes/init
    # annotate-minio.tf), same wiring as timely.
    awsAccessKeyId: AWS_ACCESS_KEY_ID
    awsSecretAccessKey: AWS_SECRET_ACCESS_KEY
    googleClientId: ""
    googleClientSecret: ""
    facebookClientId: ""
    facebookClientSecret: ""
    githubClientId: ""
    githubClientSecret: ""
    linkedinClientId: ""
    linkedinClientSecret: ""
    samlSpCert: ""
    samlSpKey: ""

mail:
  fromName: ""
  fromAddress: ""

sso:
  requireInvite: false
  # SSO availability by email domain. Format:
  # "example.com=oidc;corp.example=google,oidc"
  domains: ""
  # Domains whose SSO registrations are approved immediately. All other SSO
  # registrations remain pending unless an invite activates them. Format:
  # "example.com;corp.example" or "*" for every SSO-enabled domain.
  autoApproveDomains: ""
  oidc:
    # Default OIDC issuer for portfolio services (Authentik at auth.derobot.is)
    issuer: "https://auth.derobot.is/application/o/annotate"
    # Redirect registered on the Authentik client. The embed auth broker is the
    # primary flow for this app (popup broker on the API host); the site SSO
    # callback (https://annotate.therobotlives.com/auth/oidc/callback) is also
    # registered on the same client.
    redirectUri: "https://annotate-srv.therobotlives.com/embed/callback"
  saml:
    # Samly 1.4 expects raw metadata XML or a local metadata file path; it does
    # not fetch metadata URLs at runtime.
    idpMetadata: ""
    idpMetadataFile: ""
    # Deprecated. Kept for existing values files that used this as a file path.
    idpMetadataUrl: ""
    spEntityId: ""

extraEnv: []

configMap:
  enabled: false
  data: {}

imagePullSecrets:
  - name: ops-registry-secret

analytics:
  ga:
    measurementId: ""
  posthog:
    key: ""
    host: "https://us.i.posthog.com"

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: therobotlives-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: https://infisical.noizu.com/api
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/apps/tls/therobotlives"
    crtKey: THEROBOTLIVES_TLS_CRT
    keyKey: THEROBOTLIVES_TLS_KEY

# OpenTelemetry → SigNoz wiring (conventions: trl-infra docs/observability/
# OTEL-CONVENTIONS.md). enabled=false ships NO OTEL_* env vars at all, so the
# runtime no-ops (SDK disabled, zero connection attempts).
otel:
  enabled: true
  # The fleet site key — MUST equal the site's entry in the fleet repo's
  # app/priv/sites.yml (generated from docs/site-fleet/REGISTRY.md); SigNoz
  # deep-links key off it exactly (https://apm.noizu.com/services/<key>).
  # "annotate-app" is this scaffold's template placeholder.
  fleetSiteKey: "annotate-app"
  collectorEndpoint: "http://signoz-otel-collector.infra.svc:4318"
  protocol: "http/protobuf"
  sampler: "parentbased_traceidratio"
  samplerArg: "1.0"
  serviceNamespace: "portfolio"
  # deployment.environment: prod | stage | dev per conventions; empty falls
  # back to the release namespace.
  deploymentEnvironment: ""
  # service.version: deployed image sha/tag; empty falls back to the tag part
  # of backend.image.
  serviceVersion: ""

storage:
  # MinIO bucket `annotate` + scoped IAM user provisioned by Terraform:
  # terraform/kubernetes/init/annotate-minio.tf (monorepo). Credentials come
  # from the Infisical /apps/annotate section (AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY), synced into annotate-secrets by the InfisicalSecret
  # CRD. Same wiring as tracktimo/timely.
  enabled: true
  bucket: "annotate"
  region: "us-east-1"
  endpoint: "http://minio-service.infra.svc.cluster.local:9000"
  scheme: "http://"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

sandbox:
  enabled: false
  image: ops.noizu.com/annotate/sandbox:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
