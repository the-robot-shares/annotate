apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hologram-start-app.fullname" . }}
  labels:
    {{- include "hologram-start-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "hologram-start-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hologram-start-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.backend.port }}
          protocol: TCP
        env:
          {{- include "hologram-start-app.backendEnv" . | nindent 8 }}
        - name: HOLOGRAM_START
          value: "1"
        # Hologram.env/0 reads HOLOGRAM_ENV || MIX_ENV at runtime and falls
        # back to :dev when neither is set, which disables the Hologram
        # router and 404s every page. The image ENVs already pin these; pin
        # them here too so a rebuilt/base-image drift can never unpin them.
        - name: MIX_ENV
          value: "prod"
        - name: HOLOGRAM_ENV
          value: "prod"
        - name: FRONTEND_URL
          value: "https://{{ .Values.appDomain | default .Values.domain }}"
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- include "hologram-start-app.otelEnv" . | nindent 8 }}
          {{- include "hologram-start-app.storageEnv" . | nindent 8 }}
        {{- if .Values.configMap.enabled }}
        envFrom:
        - configMapRef:
            name: {{ include "hologram-start-app.fullname" . }}-config
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
